<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | NY SAD Duty, Leave &amp; Pay Planner</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      color: #202124;
      background: #f8f9fa;
    }
    .card {
      max-width: 440px;
      text-align: center;
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 12px;
      padding: 28px 24px;
    }
    img { width: 72px; height: 72px; border-radius: 14px; }
    h1 { margin: 14px 0 4px; font-size: 20px; line-height: 1.3; color: #1a73e8; }
    p { margin: 8px 0; font-size: 14px; line-height: 1.5; color: #5f6368; }
    a.go {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 18px;
      font-weight: 700;
      color: #fff;
      background: #1a73e8;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <img id="logo" src="./icons/icon-192.png" alt="" width="72" height="72">
    <h1>This page is on leave. Nobody approved it.</h1>
    <p>Its leave request got lost somewhere between here and the chain of command.</p>
    <p>Your saved schedule is fine. It never left your device.</p>
    <a class="go" id="home" href="./">Report back to the planner</a>
  </div>
  <script>
    // This page can be served from any depth, so point the links at the project root.
    (function () {
      var onProjectPages = location.hostname.slice(-10) === '.github.io';
      var base = onProjectPages ? '/' + location.pathname.split('/').filter(Boolean)[0] + '/' : '/';
      document.getElementById('home').setAttribute('href', base);
      document.getElementById('logo').setAttribute('src', base + 'icons/icon-192.png');
    })();
  </script>
</body>
</html>
